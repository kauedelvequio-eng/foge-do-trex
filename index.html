<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=250">
<meta name="viewport" content="width=300, initial-scale=1">
<title>Mídia e Performance</title>
<script>
  // clickTag padrão de HTML5 (Google Ads / DV360 / CM360): a plataforma troca pelo link da campanha
  var clickTag = "https://kauedelvequio-eng.github.io/vai-ser-midia-e-performance/";
</script>
<style>
  :root{
    --txt:#e6ebff; --dim:#8a95c4; --line:#2b355e; --red:#3ee6ff;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; width:300px; height:250px; overflow:hidden; background:#0d1330}
  body{
    color:var(--txt); font-family:var(--mono);
    -webkit-tap-highlight-color:transparent; touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #app{position:relative; width:300px; height:250px; overflow:hidden; background:#0d1330}
  /* borda do banner, por cima de tudo */
  #app::after{content:""; position:absolute; inset:0; border:1px solid #2b355e; pointer-events:none; z-index:9}
  canvas{display:block; width:300px; height:250px}

  /* aberto pelo link (fora do espaço do anúncio): centraliza e amplia pra caber na tela */
  html.pagina, html.pagina body{width:100%; height:100%; background:#070b1c}
  html.pagina body{display:flex; align-items:center; justify-content:center}
  html.pagina #app{flex:none; box-shadow:0 20px 60px #000a}

  #touch{position:absolute; inset:0; display:none}
  #touch.on{display:block}

  .screen{
    position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    gap:7px; padding:10px 14px; background:rgba(11,17,36,.82);
    animation:fade .25s ease;
  }
  .screen.on{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .eyebrow{color:var(--red); font-size:8px; letter-spacing:.26em; font-weight:700}
  .eyebrow i{color:#ff3d7f; font-style:normal; font-size:10px}
  h1{margin:0; font-size:21px; font-weight:600; letter-spacing:.04em; color:#ffffff; line-height:1.1}
  h1 small{display:block; font-size:8px; letter-spacing:.24em; color:var(--dim); margin-top:5px; font-weight:400}
  .lead{margin:0; max-width:262px; color:#c9d2f0; font-size:10px; line-height:1.55}
  .lead b{color:#ff5d6e}
  .lead canvas{display:inline-block; width:auto; height:auto; vertical-align:-2px; image-rendering:pixelated}
  .keys{font-size:8px; color:#8a95c4; letter-spacing:.1em}
  .row{display:flex; gap:6px; align-items:center; justify-content:center}
  button{
    font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--txt);
    background:#141b3d; border:1px solid var(--line); padding:7px 10px; cursor:pointer;
  }
  button:hover{border-color:#3ee6ff; color:#fff}
  button.primary{border-color:#3ee6ff; background:#3ee6ff; color:#0b1124; padding:9px 26px; font-weight:700}
  button.primary:hover{background:#8af1ff; color:#0b1124}
  button.cta{border-color:#ff3d7f; background:#ff3d7f; color:#fff; font-weight:700}
  button.cta:hover{background:#e0266a; color:#fff}
  .link{border:0; background:none; padding:2px; font-size:8px; letter-spacing:.14em; color:#ff3d7f; text-decoration:underline}
  .link:hover{color:#ff8ab1}
  .score{display:flex; gap:26px; justify-content:center}
  .score div{font-size:8px; color:var(--dim); letter-spacing:.14em}
  .score b{display:block; font-size:19px; color:#ffffff; font-weight:400; margin-top:3px}
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="300" height="250"></canvas>

  <div id="touch"></div>

  <!-- INÍCIO -->
  <div class="screen on" id="scr-start">
    <div class="eyebrow"><i>★</i> MÍDIA E PERFORMANCE</div>
    <h1>Corre que é T-REX<small>DE VASO E TUDO</small></h1>
    <p class="lead">Desvia do <i data-sp="trex"></i> T-rex e do <i data-sp="maluco"></i> maluco.<br>Pega 3 <i data-sp="estrela"></i> e chama o <b>criativo de 150KB</b>.</p>
    <button class="primary" id="btn-start">JOGAR</button>
    <div class="keys">toque em cima ou embaixo pra trocar de raia</div>
    <button class="link" data-cta>SAIBA MAIS ›</button>
  </div>

  <!-- FIM -->
  <div class="screen" id="scr-end">
    <div class="eyebrow" id="end-eyebrow">FIM DE JOGO</div>
    <h1 id="end-title">Virou lanche</h1>
    <p class="lead" id="end-sub"></p>
    <div class="score">
      <div>PONTOS<b id="end-pts">0</b></div>
      <div>RECORDE<b id="end-best">0</b></div>
    </div>
    <div class="row">
      <button class="primary" id="btn-again">DE NOVO</button>
      <button class="cta" data-cta>SAIBA MAIS ›</button>
    </div>
  </div>

  <!-- PAUSA -->
  <div class="screen" id="scr-pause">
    <div class="eyebrow"><i>★</i> MÍDIA E PERFORMANCE</div>
    <h1>Pausado</h1>
    <button class="primary" id="btn-resume">CONTINUAR</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ====================================================================
   1. CONSTANTES / GEOMETRIA
   ==================================================================== */
const W = 300, H = 250;
const ROAD_TOP = 96, ROAD_BOT = 238;
const LANES = 3;
const LANE_H = (ROAD_BOT - ROAD_TOP) / LANES;
const laneY = i => ROAD_TOP + LANE_H * (i + 0.5);
const PLAYER_X = 52;
const PX = 2;                // tamanho do pixel dos sprites

const CFG = { speed:92, ramp:20, spawn:1.25, dens:0.55, lives:3, meta:500 };

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 3);
const app = document.getElementById("app");

// dentro do anúncio a janela tem 300x250; maior que isso, é a página aberta pelo link
function caber(){
  const pagina = innerWidth > W + 20 || innerHeight > H + 20;
  document.documentElement.classList.toggle("pagina", pagina);
  const k = pagina ? Math.min((innerWidth - 32) / W, (innerHeight - 32) / H) : 1;
  app.style.transform = pagina ? "scale(" + k + ")" : "";
  // o canvas ganha resolução junto com a escala, pra não borrar ampliado
  const res = Math.min(dpr * k, 4);
  canvas.width = Math.round(W * res); canvas.height = Math.round(H * res);
  ctx.setTransform(res, 0, 0, res, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
caber();
addEventListener("resize", caber);

/* ====================================================================
   2. PIXEL ART  (cada sprite é uma matriz de caracteres + paleta)
   ==================================================================== */
function sprite(rows, pal){ return { rows, pal, w: rows[0].length, h: rows.length }; }

function draw(sp, x, y, px, alpha, cx){
  const c2 = cx || ctx;
  if (alpha !== undefined) c2.globalAlpha = alpha;
  for (let r = 0; r < sp.rows.length; r++){
    const row = sp.rows[r];
    for (let c = 0; c < row.length; c++){
      const ch = row[c];
      if (ch === ".") continue;
      c2.fillStyle = sp.pal[ch];
      c2.fillRect(Math.round(x + c*px), Math.round(y + r*px), px, px);
    }
  }
  if (alpha !== undefined) c2.globalAlpha = 1;
}

// foto em card com moldura neon, apoiada no chão em (cx, base); gira um pouco pra parecer que anda
function cartao(c, img, cx, base, w, h, cor, giro){
  c.save();
  c.translate(Math.round(cx), Math.round(base));
  if (giro) c.rotate(giro);
  c.shadowColor = cor; c.shadowBlur = 6;
  c.fillStyle = cor; c.fillRect(-w/2 - 2, -h - 2, w + 4, h + 4);
  c.shadowBlur = 0;
  if (img.complete && img.naturalWidth){
    c.imageSmoothingEnabled = true;
    c.drawImage(img, -w/2, -h, w, h);
  } else {
    c.fillStyle = "#0b1124"; c.fillRect(-w/2, -h, w, h);
  }
  c.restore();
}

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
};

let actx = null;
let muted = false;
function audio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq, dur, type, vol){
  if (muted || !actx) return;
  try{
    const a = actx, o = a.createOscillator(), g = a.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.04, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }catch(e){}
}
function noise(dur, vol){
  if (muted || !actx) return;
  try{
    const a = actx, n = a.sampleRate * dur;
    const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = vol || 0.1;
    src.connect(g).connect(a.destination); src.start();
  }catch(e){}
}
const SFX = {
  lane:  () => beep(520, .05, "square", .025),
  hit:   () => { noise(.3,.13); beep(110,.3,"sawtooth",.07); },
  pick:  () => { beep(660,.07,"square",.04); setTimeout(()=>beep(990,.09,"square",.04),70); },
  life:  () => { beep(520,.08,"triangle",.06); setTimeout(()=>beep(780,.1,"triangle",.06),80); setTimeout(()=>beep(1040,.14,"triangle",.06),170); },
  win:   () => [0,120,240,420].forEach((d,i)=>setTimeout(()=>beep([523,659,784,1047][i],.2,"triangle",.06),d)),
  over:  () => [0,130,260].forEach((d,i)=>setTimeout(()=>beep([330,260,180][i],.26,"sawtooth",.06),d)),
};

/* ====================================================================
   4. ESTADO DO JOGO
   ==================================================================== */
const ST = { START:"start", PLAY:"play", PAUSE:"pause", END:"end" };
let state = ST.START;

let game = null;
// demo = a cena que anda sozinha atrás da tela inicial
function novoJogo(demo){
  // atalho de teste: ?escudo=1 já começa com o criativo em campo
  const escudoURL = !demo && new URLSearchParams(location.search).has("escudo");
  game = {
    demo: !!demo,
    meta: demo ? Infinity : CFG.meta,
    t: 0, scroll: 0, dist: 0,
    vidas: CFG.lives, maxVidas: CFG.lives,
    pontos: 0, bonus: 0, frangos: 0,
    estrelas: 0,          // 3 chamam o criativo
    escudo: escudoURL ? 30 : 0,   // segundos de proteção restantes
    aviso: 0,
    lane: 1, laneAlvo: 1,
    y: laneY(1), alvoY: laneY(1),
    arrastando: false,
    inv: 0, shake: 0,
    obst: [], itens: [], parts: [], coracoes: [],
    corT: 0.6, spawnT: demo ? 0.3 : 0.9, itemT: 2.2,
    portao: null, acabou: false, motivo: "", venceu: false,
  };
}

/* ====================================================================
   5. ENTRADA
   ==================================================================== */
const keys = Object.create(null);
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup","arrowdown"," "].includes(k)) e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  if (state === ST.PLAY){
    if (k === "arrowup" || k === "w") mudarRaia(-1);
    if (k === "arrowdown" || k === "s") mudarRaia(1);
    if (k === "p" || k === "escape") pausar(true);
  } else if (state === ST.PAUSE && (k === "p" || k === "escape")){
    pausar(false);
  } else if ((state === ST.START || state === ST.END) && (k === "enter" || k === " ")){
    comecar();
  }
  if (k === "m") muted = !muted;
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function mudarRaia(d){
  const alvo = Math.max(0, Math.min(LANES-1, game.laneAlvo + d));
  if (alvo !== game.laneAlvo){
    game.laneAlvo = alvo;
    game.alvoY = laneY(alvo);
    SFX.lane();
  }
}

// toque curto: metade de cima sobe, metade de baixo desce; arrastar leva junto
const touch = document.getElementById("touch");
let toqueY = 0, arrastou = false;

function yNoJogo(clientY){
  const r = canvas.getBoundingClientRect();
  return (clientY - r.top) / r.height * H;
}
function comecarArraste(y, id){
  if (state !== ST.PLAY) return;
  game.arrastando = true; toqueY = y; arrastou = false;
  if (id !== undefined && touch.setPointerCapture){ try { touch.setPointerCapture(id); } catch(e){} }
}
function moverArraste(y){
  if (state !== ST.PLAY || !game.arrastando) return;
  if (!arrastou && Math.abs(y - toqueY) > 6) arrastou = true;
  if (arrastou) game.alvoY = Math.max(ROAD_TOP + 8, Math.min(ROAD_BOT - 8, yNoJogo(y)));
}
function soltarArraste(){
  if (!game || !game.arrastando) return;
  game.laneAlvo = game.lane;
  if (!arrastou && state === ST.PLAY){
    mudarRaia(yNoJogo(toqueY) < game.y - 6 ? -1 : 1);   // toque acima ou abaixo da personagem
  } else {
    game.alvoY = laneY(game.lane);
  }
  game.arrastando = false;
}

if (window.PointerEvent){
  touch.addEventListener("pointerdown", e => { e.preventDefault(); comecarArraste(e.clientY, e.pointerId); });
  touch.addEventListener("pointermove", e => { if (game && game.arrastando){ e.preventDefault(); moverArraste(e.clientY); } });
  touch.addEventListener("pointerup", e => { e.preventDefault(); soltarArraste(); });
  touch.addEventListener("pointercancel", soltarArraste);
} else {
  touch.addEventListener("touchstart", e => { e.preventDefault(); comecarArraste(e.touches[0].clientY); }, { passive:false });
  touch.addEventListener("touchmove", e => { e.preventDefault(); moverArraste(e.touches[0].clientY); }, { passive:false });
  touch.addEventListener("touchend", e => { e.preventDefault(); soltarArraste(); }, { passive:false });
  touch.addEventListener("mousedown", e => comecarArraste(e.clientY));
  touch.addEventListener("mousemove", e => moverArraste(e.clientY));
  touch.addEventListener("mouseup", soltarArraste);
}

/* ====================================================================
   6. LÓGICA
   ==================================================================== */
function velocidade(){
  return CFG.speed + CFG.ramp * Math.min(game.t, 30) / 30;
}

function spawnOnda(){
  // uma raia sempre livre; na demo é a raia da personagem
  const safe = game.demo ? game.lane : (Math.random() * LANES) | 0;
  for (let i = 0; i < LANES; i++){
    if (i === safe) continue;
    if (Math.random() > CFG.dens) continue;
    const tipo = (game.demo ? Math.random() < 0.3 : game.dist > 100 && Math.random() < 0.35) ? "maluco" : "trex";
    const t = TIPOS[tipo];
    game.obst.push({
      tipo, t,
      x: W + 30 + Math.random()*50,
      lane: i, y: laneY(i),
      w: t.w, h: t.h,
      fase: Math.random()*2,
      zigT: 0.9 + Math.random()*0.6,
    });
  }
}

function spawnItem(){
  const lane = (Math.random()*LANES)|0;
  const pote = ["frango"];
  if (game.vidas < game.maxVidas) pote.push("banana");
  if (game.escudo <= 0) pote.push("estrela", "estrela", "estrela");
  const tipo = pote[(Math.random()*pote.length)|0];
  const sp = tipo === "banana" ? BANANA : tipo === "estrela" ? ESTRELA : FRANGO;
  game.itens.push({ tipo, sp, x: W + 20, lane, y: laneY(lane), w: sp.w*PX, h: sp.h*PX, oy: 5, bob: Math.random()*6 });
}

function soltarCoracao(x, y){
  game.coracoes.push({ x, y, vy: -(16 + Math.random()*12), fase: Math.random()*6, vida: 1.4 + Math.random()*0.6, t: 0 });
}

function particulas(x, y, cor, n){
  for (let i = 0; i < n; i++){
    game.parts.push({
      x, y,
      vx: (Math.random()-0.5) * 110 - 16,
      vy: (Math.random()-0.5) * 90,
      vida: 0.4 + Math.random()*0.5,
      t: 0, cor, s: 1 + Math.random()*1.5,
    });
  }
}

// caixa de colisão: o sprite é desenhado de (y - h + oy) até (y + oy)
function caixa(e, fx, fy){
  const px = e.w * fx, py = e.h * fy;
  const oy = e.oy === undefined ? 9 : e.oy;
  return { x: e.x - e.w/2 + px, y: e.y - e.h + oy + py, w: e.w - px*2, h: e.h - py*2 };
}
function bateu(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function levarDano(obj){
  game.vidas--;
  game.inv = 1.5;
  game.shake = 6;
  SFX.hit();
  particulas(obj.x, obj.y - 10, obj.t.cor, 18);
  const fins = obj.t.fins;
  if (game.vidas <= 0) fim(false, fins[(Math.random()*fins.length)|0]);
}

function fim(venceu, motivo){
  game.acabou = true;
  game.venceu = venceu;
  game.motivo = motivo || "";
  game.shake = 0;
  state = ST.END;
  touch.classList.remove("on");
  venceu ? SFX.win() : SFX.over();
  telaFim();
}

function atualizar(dt){
  const g = game;
  g.t += dt;
  const v = velocidade();
  g.scroll += v * dt;
  if (!g.portao) g.dist += v * dt / 5;

  g.y += (g.alvoY - g.y) * Math.min(1, dt * (g.arrastando ? 24 : 14));
  g.lane = Math.max(0, Math.min(LANES-1, Math.round((g.y - ROAD_TOP) / LANE_H - 0.5)));

  if (g.inv > 0) g.inv -= dt;
  if (g.escudo > 0) g.escudo -= dt;
  if (g.aviso > 0) g.aviso -= dt;
  if (g.shake > 0) g.shake = Math.max(0, g.shake - dt * 20);

  if (!g.portao && g.dist >= g.meta){
    g.portao = { x: W + 40 };
    SFX.pick();
  }

  if (!g.portao){
    g.spawnT -= dt;
    if (g.spawnT <= 0){
      spawnOnda();
      g.spawnT = Math.max(0.68, CFG.spawn - g.t * 0.014) * (0.85 + Math.random()*0.35);
    }
    if (!g.demo){
      g.itemT -= dt;
      if (g.itemT <= 0){ spawnItem(); g.itemT = 2.4 + Math.random()*1.8; }
    }
  }

  const pBox = { x: PLAYER_X - 8, y: g.y - 22, w: 16, h: 28 };
  if (g.escudo > 0) pBox.w += 40;   // o criativo segura o que vem pela frente

  for (let i = g.obst.length - 1; i >= 0; i--){
    const o = g.obst[i];
    o.x -= (v + o.t.extra) * dt;
    o.fase += dt * 7;
    // o maluco troca de raia sozinho (na demo, nunca para a raia da personagem)
    if (o.t.zig){
      o.zigT -= dt;
      if (o.zigT <= 0){
        const nova = Math.max(0, Math.min(LANES-1, o.lane + (Math.random()<0.5?-1:1)));
        if (!g.demo || nova !== g.lane) o.lane = nova;
        o.zigT = 0.75 + Math.random()*0.5;
      }
      o.y += (laneY(o.lane) - o.y) * Math.min(1, dt*8);
    }
    if (o.x < -40){ g.obst.splice(i,1); g.bonus += 2; continue; }
    if (g.demo) continue;
    if (bateu(pBox, caixa(o, .2, .14))){
      if (g.escudo > 0){                       // barrado pelo criativo
        g.obst.splice(i,1);
        g.bonus += 15;
        particulas(o.x - 6, o.y - 12, "#ffd84d", 14);
        SFX.lane();
        continue;
      }
      if (g.inv <= 0){
        g.obst.splice(i,1);
        levarDano(o);
        if (g.acabou) return;
      }
    }
  }

  for (let i = g.itens.length - 1; i >= 0; i--){
    const it = g.itens[i];
    it.x -= v * dt;
    it.bob += dt * 5;
    if (it.x < -30){ g.itens.splice(i,1); continue; }
    if (bateu(pBox, caixa(it, .1, .12))){
      g.itens.splice(i,1);
      if (it.tipo === "banana"){
        g.vidas = Math.min(g.maxVidas, g.vidas + 1);
        SFX.life(); particulas(it.x, it.y-10, "#e8c75a", 12);
      } else if (it.tipo === "estrela"){
        g.estrelas++;
        particulas(it.x, it.y-10, "#ffd84d", 12);
        if (g.estrelas >= 3){
          g.estrelas = 0; g.escudo = 8; g.aviso = 1.8;
          for (let k = 0; k < 6; k++) soltarCoracao(PLAYER_X + (Math.random()-.5)*34, g.y - 44 - Math.random()*12);
          SFX.life();
        } else SFX.pick();
      } else {
        g.frangos++;
        SFX.pick(); particulas(it.x, it.y-10, "#e6b07a", 10);
      }
    }
  }

  for (let i = g.parts.length - 1; i >= 0; i--){
    const p = g.parts[i];
    p.t += dt;
    if (p.t >= p.vida){ g.parts.splice(i,1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 100 * dt;
  }

  // coraçõezinhos: de vez em quando, e bem mais com o criativo por perto
  g.corT -= dt;
  if (g.corT <= 0){
    soltarCoracao(PLAYER_X + (Math.random()-.5)*10, g.y - 40);
    g.corT = g.escudo > 0 ? 0.3 + Math.random()*0.2 : 1 + Math.random()*0.9;
  }
  for (let i = g.coracoes.length - 1; i >= 0; i--){
    const c = g.coracoes[i];
    c.t += dt;
    if (c.t >= c.vida){ g.coracoes.splice(i,1); continue; }
    c.y += c.vy * dt;
    c.fase += dt * 4;
  }

  if (g.portao){
    g.portao.x -= v * dt;
    if (g.portao.x <= PLAYER_X){ fim(true); return; }
  }

  g.pontos = Math.floor(g.dist) + g.frangos * 50 + g.bonus;
}

/* ====================================================================
   7. DESENHO

const FONTE = "ui-monospace, Consolas, monospace";
const KPIS = [["CTR", "3,2%"], ["ROAS", "4,8x"], ["CPA", "-27%"], ["VIEWS", "1,2M"]];
const ICONES = ["▶", "♥", "@", "#", "%", "★"];

// monitor na parede: alterna gráfico de barras, linha subindo e um KPI
function monitor(x, y, w, h, n, t){
  ctx.fillStyle = "#2b355e"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = "#0b1124"; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
  const ix = x + 3, iy = y + 3, iw = w - 6, ih = h - 6;
  const tipo = ((n % 3) + 3) % 3;
  if (tipo === 0){
    const bw = (iw - 12) / 6;
    for (let b = 0; b < 6; b++){
      const alt = Math.round((0.28 + 0.11 * b + 0.07 * Math.sin(t * 3 + b + n)) * (ih - 8));
      ctx.fillStyle = b % 2 ? "#ff3d7f" : "#3ee6ff";
      ctx.fillRect(Math.round(ix + 6 + b * bw), iy + ih - 4 - alt, Math.round(bw - 3), alt);
    }
  } else if (tipo === 1){
    ctx.fillStyle = "#3ee6ff18";
    for (let k = 1; k < 4; k++) ctx.fillRect(ix + 2, Math.round(iy + k * ih / 4), iw - 4, 1);
    ctx.strokeStyle = "#4ad98a"; ctx.lineWidth = 2;
    ctx.beginPath();
    let px = 0, py = 0;
    for (let k = 0; k <= 8; k++){
      px = ix + 5 + k * (iw - 10) / 8;
      py = iy + ih - 6 - (k / 8) * (ih - 14) + Math.sin(k * 1.7 + n) * 3;
      if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.stroke();
    ctx.fillStyle = Math.sin(t * 6) > 0 ? "#b6ffd6" : "#4ad98a";
    ctx.fillRect(px - 2, py - 2, 4, 4);
  } else {
    const kpi = KPIS[((Math.floor(n / 3) % 4) + 4) % 4];
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillStyle = "#8a95c4"; ctx.font = "700 7px " + FONTE;
    ctx.fillText(kpi[0], ix + 7, iy + 6);
    ctx.fillStyle = "#ffffff"; ctx.font = "700 16px " + FONTE;
    ctx.fillText(kpi[1], ix + 7, iy + 16);
    ctx.fillStyle = "#4ad98a"; ctx.font = "700 10px " + FONTE;
    ctx.fillText("▲", ix + iw - 16, iy + 19);
  }
}

function drawFundo(){
  const g = game, s = g ? g.scroll : 0, t = g ? g.t : 0;

  // parede: painel escuro de dashboard
  const pg = ctx.createLinearGradient(0, 0, 0, ROAD_TOP);
  pg.addColorStop(0, "#0d1330"); pg.addColorStop(1, "#1a2350");
  ctx.fillStyle = pg;
  ctx.fillRect(0, 0, W, ROAD_TOP);

  // ícones de rede social flutuando bem ao fundo
  const off0 = (s * 0.25) % 75;
  let ic = Math.floor(s * 0.25 / 75);
  ctx.save();
  ctx.font = "700 11px " + FONTE;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let x = -75 - off0; x < W + 75; x += 75, ic++){
    const k = ((ic % ICONES.length) + ICONES.length) % ICONES.length;
    ctx.fillStyle = k % 2 ? "#ff3d7f55" : "#3ee6ff55";
    ctx.fillText(ICONES[k], x + 30, ic % 2 ? 30 : 64);
  }
  ctx.restore();

  // monitores com os números da campanha (parallax lento)
  const off = (s * 0.14) % 150;
  let n = Math.floor(s * 0.14 / 150);
  for (let x = -150 - off; x < W + 150; x += 150, n++) monitor(x + 10, 26, 112, 46, n, t);

  // servidores piscando encostados na parede
  const off2 = (s * 0.45) % 140;
  let sv = Math.floor(s * 0.45 / 140);
  for (let x = -140 - off2; x < W + 140; x += 140, sv++){
    ctx.fillStyle = "#222b52"; ctx.fillRect(x + 70, ROAD_TOP - 21, 50, 15);
    ctx.fillStyle = "#11173a"; ctx.fillRect(x + 72, ROAD_TOP - 19, 30, 11);
    for (let d = 0; d < 4; d++){
      const aceso = Math.sin(t * (4 + d) + d * 2 + sv) > -0.2;
      ctx.fillStyle = aceso ? (d % 2 ? "#4ad98a" : "#3ee6ff") : "#2b355e";
      ctx.fillRect(x + 105 + (d % 2) * 6, ROAD_TOP - 18 + (d >> 1) * 6, 3, 3);
    }
  }

  // rodapé de neon
  ctx.save();
  ctx.shadowColor = "#3ee6ff"; ctx.shadowBlur = 6;
  ctx.fillStyle = "#3ee6ff"; ctx.fillRect(0, ROAD_TOP - 2, W, 2);
  ctx.restore();

  // piso em faixas escuras
  for (let i = 0; i < LANES; i++){
    ctx.fillStyle = i % 2 ? "#1d2550" : "#1a2146";
    ctx.fillRect(0, ROAD_TOP + LANE_H * i, W, LANE_H + 1);
  }

  // grade digital passando no chão
  ctx.fillStyle = "#3ee6ff14";
  const off3 = s % 24;
  for (let x = -off3; x < W; x += 24) ctx.fillRect(Math.round(x), ROAD_TOP, 1, ROAD_BOT - ROAD_TOP);

  // divisórias tracejadas
  ctx.save();
  ctx.strokeStyle = "#3ee6ff77"; ctx.lineWidth = 2;
  ctx.setLineDash([24, 18]);
  ctx.lineDashOffset = -(s % 42);
  for (let i = 1; i < LANES; i++){
    const y = Math.round(ROAD_TOP + LANE_H * i);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  // linha do tempo da campanha na beirada de baixo
  ctx.fillStyle = "#0d1330"; ctx.fillRect(0, ROAD_BOT, W, H - ROAD_BOT);
  ctx.fillStyle = "#ff3d7f"; ctx.fillRect(0, ROAD_BOT, W, 1);
  const tl = ["#3ee6ff44", "#ff3d7f44", "#4ad98a44", "#f0a93c44"];
  const off5 = (s * 1.15) % 75;
  let m = Math.floor(s * 1.15 / 75);
  for (let x = -75 - off5; x < W + 75; x += 75, m++){
    ctx.fillStyle = tl[((m % tl.length) + tl.length) % tl.length];
    ctx.fillRect(x + 4, ROAD_BOT + 4, 67, H - ROAD_BOT - 7);
  }
}

function sombra(x, y, w, a){
  ctx.save();
  ctx.globalAlpha = a === undefined ? .35 : a;
  ctx.fillStyle = "#000814";
  ctx.beginPath(); ctx.ellipse(x, y + 3, w/2, w/6, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawPortao(){
  const p = game.portao; if (!p) return;
  const x = p.x;
  ctx.save();
  ctx.fillStyle = "#0e1a14";
  ctx.fillRect(x-3, ROAD_TOP-12, 7, ROAD_BOT-ROAD_TOP+16);
  ctx.shadowColor = "#4ad98a"; ctx.shadowBlur = 10;
  ctx.fillStyle = "#4ad98a";
  ctx.fillRect(x-1, ROAD_TOP-12, 2, ROAD_BOT-ROAD_TOP+16);
  ctx.font = "700 9px ui-monospace, Consolas, monospace";
  ctx.textAlign = "center"; ctx.fillStyle = "#4ad98a";
  ctx.fillText("CONVERSÃO", x - 20, ROAD_TOP-16);
  ctx.restore();
}

function drawJogador(){
  const g = game;
  const piscando = g.inv > 0 && Math.floor(g.t * 14) % 2 === 0;
  const passo = Math.floor(g.scroll / 12) % 2 === 0;
  sombra(PLAYER_X, g.y + 5, 34, .4);
  // o vaso dá uns pulinhos enquanto desliza
  if (!piscando) cartao(ctx, FOTO_VASO, PLAYER_X, g.y + 9 - (passo ? 0 : 1), 38, 39, "#3ee6ff", passo ? -0.03 : 0.03);
}

function plaquinha(texto, cx, topo, cor){
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "700 7px ui-monospace, Consolas, monospace";
  const tw = ctx.measureText(texto).width + 10, th = 11;
  const x = Math.max(2, Math.min(W - tw - 2, cx - tw/2));
  ctx.fillStyle = "#fffaf0ee";
  ctx.fillRect(x, topo, tw, th);
  ctx.strokeStyle = cor; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, topo + .5, tw - 1, th - 1);
  ctx.fillStyle = cor;
  ctx.fillText(texto, x + tw/2, topo + 6);
  ctx.restore();
}

// o criativo de 150KB entra na frente e segura os T-rex
function drawCriativo(){
  const g = game;
  const w = CRIATIVO.w * PX, h = CRIATIVO.h * PX;
  const cx = PLAYER_X + 32;
  const bob = Math.sin(g.t * 7) * 1.5;
  const y = Math.round(g.y - h + 9 + bob);
  const acabando = g.escudo < 2 && Math.floor(g.t * 9) % 2 === 0;
  sombra(cx, g.y + 5, 28, .3);
  if (acabando) return;
  ctx.save();
  ctx.shadowColor = "#3ee6ff"; ctx.shadowBlur = 8;
  draw(CRIATIVO, cx - w/2, y, PX);
  ctx.restore();
  // o peso escrito na faixa rosa
  ctx.save();
  ctx.font = "700 7px " + FONTE;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.fillText("150KB", cx, y + (CRIATIVO_FAIXA + 2) * PX);
  ctx.restore();
  plaquinha("CRIATIVO 300x250", cx, y - 14, "#ff3d7f");
}

function drawHUD(){
  const g = game;
  const hg = ctx.createLinearGradient(0, 0, 0, 24);
  hg.addColorStop(0, "#0b1124f0"); hg.addColorStop(1, "#0b112400");
  ctx.fillStyle = hg; ctx.fillRect(0, 0, W, 24);

  for (let i = 0; i < g.maxVidas; i++) draw(i < g.vidas ? CORACAO : CORACAO_OFF, 8 + i * 17, 6, 2);

  ctx.save();
  ctx.font = "12px ui-monospace, Consolas, monospace";
  ctx.textBaseline = "middle";
  for (let i = 0; i < 3; i++){
    const on = g.escudo > 0 || i < g.estrelas;
    ctx.fillStyle = on ? "#ffd84d" : "#3a4570";
    ctx.fillText("★", 62 + i * 12, 13);
  }

  // barra até a saída
  const bx = 106, bw = 120, p = Math.min(1, g.dist / CFG.meta);
  ctx.fillStyle = "#ffffff22"; ctx.fillRect(bx, 12, bw, 2);
  ctx.fillStyle = "#3ee6ff"; ctx.fillRect(bx, 12, bw * p, 2);
  ctx.fillRect(Math.round(bx + bw * p - 3), 10, 6, 6);

  ctx.textAlign = "right";
  ctx.fillStyle = "#ffffff";
  ctx.font = "700 11px ui-monospace, Consolas, monospace";
  ctx.fillText(g.pontos, W - 8, 10);
  ctx.fillStyle = "#8a95c4";
  ctx.font = "7px ui-monospace, Consolas, monospace";
  ctx.fillText("PONTOS", W - 8, 19);
  ctx.restore();
}

function drawCena(){
  const g = game;
  ctx.save();
  if (g && g.shake > 0) ctx.translate((Math.random()-.5)*g.shake, (Math.random()-.5)*g.shake);
  drawFundo();

  // obstáculos e itens de trás pra frente, para quem está mais embaixo ficar na frente
  const coisas = g.obst.concat(g.itens).sort((a, b) => a.y - b.y);
  for (const o of coisas){
    if (o.t){
      sombra(o.x, o.y + 5, o.w * .8);
      cartao(ctx, o.t.foto, o.x, o.y + 9, o.w, o.h, o.t.borda, Math.sin(o.fase * 1.6) * 0.06);
    } else {
      const fy = Math.sin(o.bob) * 2;
      sombra(o.x, o.y + 5, o.w * .7, .25);
      ctx.save();
      ctx.shadowColor = o.tipo === "estrela" ? "#ffd84d" : "#e6b07a";
      ctx.shadowBlur = 6;
      draw(o.sp, o.x - o.w/2, o.y - o.h + 5 + fy, PX);
      ctx.restore();
    }
  }
  drawPortao();
  drawJogador();
  if (g.escudo > 0) drawCriativo();

  // aviso de que o criativo chegou
  if (g.aviso > 0){
    const k = Math.min(1, (1.8 - g.aviso) * 6);
    ctx.save();
    ctx.globalAlpha = Math.min(1, g.aviso * 1.4);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "700 " + Math.round(17 + (1 - k) * 8) + "px ui-monospace, Consolas, monospace";
    ctx.lineWidth = 4; ctx.strokeStyle = "#fffaf0";
    ctx.strokeText("CRIATIVO 150KB!", W/2, 82);
    ctx.fillStyle = "#ff3d7f";
    ctx.fillText("CRIATIVO 150KB!", W/2, 82);
    ctx.restore();
  }

  for (const c of g.coracoes){
    const a = Math.min(1, c.t * 5, (c.vida - c.t) * 2);
    const x = c.x + Math.sin(c.fase) * 3 - CORACAO.w;
    ctx.globalAlpha = a;
    for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) draw(CORACAO_BORDA, x+dx, c.y+dy, 2);
    draw(CORACAO, x, c.y, 2, a);
  }

  for (const p of g.parts){
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.vida);
    ctx.fillStyle = p.cor;
    ctx.fillRect(p.x, p.y, p.s, p.s);
  }
  ctx.globalAlpha = 1;

  if (!g.demo) drawHUD();

  const vg = ctx.createRadialGradient(W/2, H/2, H*0.45, W/2, H/2, H*0.95);
  vg.addColorStop(0, "#00000000"); vg.addColorStop(1, "#00000044");
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* ====================================================================
   8. TELAS
   ==================================================================== */
const el = id => document.getElementById(id);

function mostrar(id){
  for (const s of document.querySelectorAll(".screen")) s.classList.remove("on");
  if (id) el(id).classList.add("on");
}

function best(){ return +LS.get("vsmp.trex.best", 0) || 0; }

function telaFim(){
  const g = game;
  const recorde = g.pontos > best();
  if (recorde) LS.set("vsmp.trex.best", String(g.pontos));
  el("end-eyebrow").textContent = g.venceu ? "MISSÃO CUMPRIDA" : "FIM DE JOGO";
  el("end-title").textContent = g.venceu ? "Converteu!" : "Virou lanche";
  el("end-sub").textContent = g.venceu ? VITORIAS[(Math.random()*VITORIAS.length)|0] : g.motivo;
  el("end-pts").textContent = g.pontos;
  el("end-best").textContent = best();
  mostrar("scr-end");
}

function comecar(){
  try { const a = audio(); if (a.state === "suspended") a.resume(); } catch(e){}
  novoJogo(false);
  mostrar(null);
  touch.classList.add("on");
  state = ST.PLAY;
}

function pausar(p){
  if (p && state === ST.PLAY){ state = ST.PAUSE; mostrar("scr-pause"); }
  else if (!p && state === ST.PAUSE){ state = ST.PLAY; mostrar(null); }
}

// mini sprites dentro do texto da tela inicial
const MINIS = { trex:FOTO_TREX, maluco:FOTO_MALUCO, estrela:ESTRELA };
for (const alvo of document.querySelectorAll("[data-sp]")){
  const sp = MINIS[alvo.dataset.sp];
  if (sp instanceof Image){
    // foto vira uma miniatura com moldura, igual ao card do jogo
    const img = document.createElement("img");
    img.src = sp.src; img.alt = "";
    img.style.cssText = "height:16px; vertical-align:-4px; border:1px solid " + (sp === FOTO_MALUCO ? "#ffd84d" : "#ff3d7f");
    alvo.appendChild(img);
    continue;
  }
  const cv = document.createElement("canvas");
  cv.width = sp.w * dpr; cv.height = sp.h * dpr;
  cv.style.width = sp.w + "px"; cv.style.height = sp.h + "px";
  const c2 = cv.getContext("2d");
  draw(sp, 0, 0, dpr, undefined, c2);
  alvo.appendChild(cv);
}

el("btn-start").addEventListener("click", comecar);
el("btn-again").addEventListener("click", comecar);
el("btn-resume").addEventListener("click", () => pausar(false));
for (const b of document.querySelectorAll("[data-cta]")){
  b.addEventListener("click", () => window.open(window.clickTag, "_blank"));
}

/* ====================================================================
   9. LOOP
   ==================================================================== */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pausar(true);
  last = performance.now();
});

// a cena de fundo da tela inicial para de andar em 30 s (regra de animação dos banners)
const DEMO_MAX = 30;
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === ST.PLAY) atualizar(dt);
  else if (state === ST.START && game.t < DEMO_MAX) atualizar(dt);
  drawCena();
  requestAnimationFrame(loop);
}

novoJogo(true);
requestAnimationFrame(loop);

})();
</script>
